# Railway / Nixpacks build for the prescient operator FastAPI service.
# The repo is a uv-managed Python project; install with uv, run uvicorn.

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
  "pip install uv",
  "uv sync --frozen --no-dev",
]

[start]
# Railway injects $PORT. Bind 0.0.0.0 so the container is reachable.
cmd = "uv run uvicorn prescient.operator.api:app --host 0.0.0.0 --port $PORT"
