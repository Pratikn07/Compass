[project]
name = "prescient"
version = "0.1.0"
description = "Autonomous earnings read-through trading system — deterministic signal engine + Claude analyst + pluggable broker adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",          # async HTTP for data/broker adapters
    "pydantic>=2.7",        # typed models + config validation
    "pyyaml>=6.0",          # config/themes loading
    "anthropic>=0.39",      # Claude analyst
    "alpaca-py>=0.30",      # primary broker (options + paper)
    "python-dotenv>=1.0",   # .env loading
    "tenacity>=8.2",        # retry/backoff on data calls
    "rich>=13.7",           # dashboard / log formatting
    "openai>=1.0",          # GPT transcript summarizer
    "robin-stocks>=3.3",    # Robinhood broker adapter (stocks only)
    "supabase>=2,<3",       # R6.4 backend-only Supabase storage adapter
    "fastapi>=0.115",       # operator status/action API
    "uvicorn[standard]>=0.30", # local operator API server
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
prescient = "prescient.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
