[project]
name = "compass"
version = "0.1.0"
description = "Theme-trend investing advisor — Phase 1 data foundation"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008: `Depends(...)` in defaults is FastAPI's canonical injection pattern.
"src/compass/api/main.py" = ["B008"]
